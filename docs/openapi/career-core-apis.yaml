# 生涯规划系统 · 推荐接口 OpenAPI 定义（用于导入 Apifox 项目 8662286）
# 说明：
#   - 推荐接口（run/latest/feedback）的请求参数与返回结果在此完整定义；
#   - Demo 无登录态，接口统一增加可选 studentId 查询参数（缺省 1001）。
# 导入方式：Apifox -> 项目设置 -> 导入数据 -> OpenAPI/Swagger -> 选择本文件。
openapi: 3.1.0
info:
  title: 生涯规划系统 · 推荐接口定义
  description: |
    推荐 Recommendations 模块的接口定义。
    请求参数：Demo 无登录态，统一增加可选 studentId（缺省 1001）。
    返回结果：线上结构 + 增强字段（name/type/reason 等）。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: 本地 Demo

paths:
  /api/v1/recommendations/run:
    post:
      summary: 生成推荐
      description: 触发一次推荐计算并落库（recommendation_run / recommendation_result），响应空对象。
      operationId: runRecommendation
      parameters:
        - $ref: '#/components/parameters/StudentIdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'

  /api/v1/recommendations/latest:
    get:
      summary: 查询推荐结果
      description: 返回该学生的 3-5 个推荐方向（线上字段 directionId/score/rank/confidence + 增强字段 name/type/reason）。
      operationId: getRecommendations
      parameters:
        - $ref: '#/components/parameters/StudentIdParam'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    required: [results]
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecommendationItem'

  /api/v1/recommendations/{id}/feedback:
    post:
      summary: 推荐反馈
      description: 对某条推荐结果提交反馈（写 recommendation_feedback），响应空对象。
      operationId: feedbackRecommendation
      parameters:
        - name: id
          in: path
          required: false
          description: 推荐结果ID（recommendation_result.id）。可留空：留空时自动使用最近一次推荐结果ID（Demo 兜底）；建议填写 55。
          example: 55
          schema:
            type: integer
            example: 55
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                feedbackType:
                  type: string
                  enum: [LIKE, DISLIKE, INVALID]
                  description: 反馈类型
                comment:
                  type: string
                  description: 反馈意见
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEmpty'

components:
  parameters:
    StudentIdParam:
      name: studentId
      in: query
      required: false
      description: 学生ID（Demo 无登录态，缺省 1001）
      example: 1001
      schema:
        type: integer
        example: 1001

  schemas:
    ApiResponseEmpty:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object
          example: {}

    RecommendationItem:
      type: object
      required: [directionId, score, rank, confidence]
      properties:
        directionId:
          type: integer
          description: 方向ID（career_direction.id）
          example: 2
        name:
          type: string
          description: 方向名称（增强字段）
          example: 数据科学与算法工程师
        type:
          type: string
          description: 方向类型（增强字段）
          example: 数据算法
        score:
          type: number
          format: double
          description: 匹配度评分（0-1，六维加权 + 霍兰德人格契合度软加分）
          example: 0.9765
        rank:
          type: integer
          description: 排序名次
          example: 1
        confidence:
          type: number
          format: double
          description: 置信度（归一化概率表达，softmax 归一化，0-1，本次推荐结果集合内求和约等于 1；Demo 替代原先 HIGH/MEDIUM/LOW 枚举）
          example: 0.288
        reason:
          type: string
          description: 推荐理由（增强字段，优先 career-ai 大模型生成，失败回退规则模板；含霍兰德人格契合与“建议加强”差距提示）
          example: 根据你的兴趣匹配96%、能力匹配95%、发展倾向匹配94%，综合匹配度 95%，你的霍兰德人格类型（R/I/C）与【软件开发工程师】方向契合度 100%，推荐关注【软件开发工程师】方向。建议加强：实践经历。
