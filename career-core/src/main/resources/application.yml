spring:
  application:
    name: career-core
  autoconfigure:
    # 使用 JWT 无状态认证,不需要默认 UserDetailsService(避免生成无关的安全密码)
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    # 未显式指定 profile 时默认使用 local(数据库凭据等在 application-local.yml 中,已 gitignore)
    default: local
  sql:
    init:
      # 应用启动时执行建表与种子脚本(幂等)
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/advisor.sql,classpath:db/advisor-domain.sql,classpath:db/admin-config.sql,classpath:db/admin-curriculum.sql,classpath:db/admin-log.sql,classpath:db/ai-chat.sql,classpath:db/core-domains.sql
      data-locations: classpath:db/data.sql
      continue-on-error: false
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.rickgao.careercore.modules
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# AI 网关（career-ai）配置：career-core 全量大模型调用走网关（2026-08-29 起，原 llm.* 已废弃）
# 环境变量注入，不硬编码；多渠道路由/重试/降级/调用日志由 career-ai 网关负责
ai:
  gateway-base-url: ${AI_GATEWAY_BASE_URL:http://127.0.0.1:8000}
  gateway-api-key: ${AI_GATEWAY_API_KEY:}
  gateway-model: ${AI_GATEWAY_MODEL:default}
  gateway-timeout: ${AI_GATEWAY_TIMEOUT:30}

# Deprecated（2026-08-29）：直连大模型配置，仅为兼容保留，代码不再读取
llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:}
  timeout: ${LLM_TIMEOUT:20}

logging:
  level:
    com.rickgao.careercore: info
    org.springframework.security: warn
