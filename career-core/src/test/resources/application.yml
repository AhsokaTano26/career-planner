spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:career_core;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/advisor.sql,classpath:db/advisor-domain.sql,classpath:db/admin-config.sql,classpath:db/admin-curriculum.sql,classpath:db/admin-log.sql,classpath:db/ai-chat.sql,classpath:db/core-domains.sql
      data-locations: classpath:db/data.sql
      continue-on-error: true

jwt:
  secret: test-jwt-secret-with-at-least-32-bytes

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.rickgao.careercore.modules
  configuration:
    map-underscore-to-camel-case: true
