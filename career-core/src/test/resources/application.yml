spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "jdbc:h2:mem:career_core;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=MONTH"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/test-domain-baseline.sql,classpath:db/ai-chat.sql,classpath:db/core-domains.sql
      continue-on-error: false

jwt:
  secret: test-jwt-secret-with-at-least-32-bytes

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.rickgao.careercore.modules
  configuration:
    map-underscore-to-camel-case: true
